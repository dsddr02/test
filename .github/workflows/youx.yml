name: youx

on:
  workflow_dispatch:
  schedule:
    - cron: '0 06,18 * * *'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install cloudscraper

      - name: Process and Compare
        run: |
          # 1. 定义订阅地址列表
          SUBSCRIPTIONS=(
            "https://vl.cm.soso.edu.kg/sub?uuid=00000000-0000-4000-8000-000000000000&host=example.com"
            "https://honghong.yyylll.kdns.fr/sub/user/eyJ1IjoiZnVodSIsImUiOjE3OTA1NzQ2Mzc3MjUsInMiOiJkNWU2ZjA1YmNlZDliMzgwIn0?protocol=default"
          )

          # 2. 创建 Python 抓取脚本
          cat << 'EOF' > scraper.py
          import cloudscraper
          import sys
          import re
          import base64
          import json

          def fetch_url(url):
              scraper = cloudscraper.create_scraper(
                  browser={
                      'browser': 'chrome',
                      'platform': 'windows',
                      'desktop': True
                  }
              )
              try:
                  res = scraper.get(url, timeout=15)
                  if res.status_code == 200:
                      html = res.text
                      # 尝试提取 pre 标签内容
                      if "<pre" in html:
                          match = re.search(r'<pre[^>]*>(.*?)</pre>', html, re.S)
                          if match:
                              return match.group(1).strip()
                      return html.strip()
                  else:
                      print(f"Error: Status code {res.status_code} for {url}", file=sys.stderr)
                      return None
              except Exception as e:
                  print(f"Exception: {str(e)} for {url}", file=sys.stderr)
                  return None

          if __name__ == "__main__":
              if len(sys.argv) > 1:
                  url = sys.argv[1]
                  data = fetch_url(url)
                  if data:
                      print(data)
                  else:
                      sys.exit(1)
              else:
                  sys.exit(1)
          EOF

          # 3. 清空临时文件
          rm -f valid_ipsyd.tmp all_data.tmp
          touch valid_ipsyd.tmp

          # 4. 遍历每个订阅地址
          for sub_url in "${SUBSCRIPTIONS[@]}"; do
            echo "🔄 正在处理订阅: $sub_url"
            
            MAX_RETRIES=3
            RETRY_COUNT=0
            response=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              response=$(python3 scraper.py "$sub_url")
              if [ $? -eq 0 ] && [ -n "$response" ]; then
                echo "✅ 数据抓取成功！"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "⚠️ 抓取失败，第 $RETRY_COUNT 次重试..."
                sleep 5
              fi
            done

            if [ -z "$response" ]; then
              echo "❌ 无法抓取订阅: $sub_url，跳过..."
              continue
            fi

            # 5. 解码数据
            decoded_data=""
            
            # 方法1: 尝试 base64 解码
            decoded_data=$(echo "$response" | base64 -d 2>/dev/null || echo "")
            
            # 检查解码后的数据是否包含节点协议
            if [ -n "$decoded_data" ] && [[ "$decoded_data" =~ "vless://" || "$decoded_data" =~ "vmess://" ]]; then
                echo "✅ Base64 解码成功，包含节点信息"
            else
                # 方法2: 直接使用原始数据
                decoded_data="$response"
                if [[ "$decoded_data" =~ "vless://" || "$decoded_data" =~ "vmess://" ]]; then
                    echo "✅ 原始数据包含节点信息"
                else
                    # 方法3: 尝试多次解码（有些数据是双重base64编码）
                    decoded_data=$(echo "$response" | base64 -d 2>/dev/null | base64 -d 2>/dev/null || echo "")
                    if [[ "$decoded_data" =~ "vless://" || "$decoded_data" =~ "vmess://" ]]; then
                        echo "✅ 双重 Base64 解码成功"
                    else
                        echo "❌ 无法解码节点数据"
                        continue
                    fi
                fi
            fi

            echo "数据校验通过，开始解析节点..."
            
            # 初始化计数器
            if [ -f counter.tmp ]; then
              counter=$(cat counter.tmp)
            else
              counter=0
            fi
            
            # 处理每一行（使用 while 循环处理多行）
            echo "$decoded_data" | while IFS= read -r line || [ -n "$line" ]; do
              # 去除空白字符
              line=$(echo "$line" | xargs)
              if [[ -z "$line" ]]; then continue; fi
              
              # 检查行是否包含节点协议
              if [[ ! "$line" =~ "vless://" && ! "$line" =~ "vmess://" ]]; then
                  continue
              fi
              
              # 提取 IP:PORT (针对 vless 格式)
              ip_port=""
              if [[ "$line" =~ "vless://" ]]; then
                  ip_port=$(echo "$line" | grep -oP '(?<=@)[^?]+' | head -1)
              fi
              
              # 如果没提取到，尝试其他方式
              if [ -z "$ip_port" ]; then
                  ip_port=$(echo "$line" | sed -n 's/.*@\([^?]*\).*/\1/p')
              fi
              
              # 提取标签
              raw_tag=""
              if [[ "$line" =~ "#" ]]; then
                  raw_tag=$(echo "$line" | awk -F'#' '{print $NF}' | cut -d'?' -f1)
              else
                  # 尝试从 remark 或 name 字段提取
                  raw_tag=$(echo "$line" | grep -oP '(remark|name)[=:][^&]+' | head -1 | sed 's/remark[=:]//;s/name[=:]//')
              fi
              
              # URL 解码标签
              if [ -n "$raw_tag" ]; then
                  tag=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "$raw_tag" 2>/dev/null || echo "$raw_tag")
                  remark="$tag"
              else
                  remark=""
              fi
              
              # 过滤掉不需要的节点
              if echo "$remark" | grep -q -E "官方优选|security|path"; then 
                  echo "⏭️ 剔除节点: $remark"
                  continue
              fi        
              
              # 判断是否为 JP 区域（日本）
              if [[ -n "$remark" && ("$remark" =~ "日本" || "$remark" =~ "JP" || "$remark" =~ "🇯🇵") ]]; then 
                  if [[ -n "$ip_port" ]]; then
                    counter=$((counter + 1))
                    echo "${ip_port}#西恩${counter}" >> valid_ipsyd.tmp
                    echo "✅ 添加 JP: ${ip_port}#西恩${counter}"
                  fi
              fi
            done
            
            # 保存计数器
            echo "$counter" > counter.tmp
            echo "📊 当前累计节点数: $counter"
            
          done

          # 清理
          rm -f counter.tmp

          # 6. 检查结果
          if [ ! -f valid_ipsyd.tmp ] || [ ! -s valid_ipsyd.tmp ]; then
            echo "⚠️ 未找到任何有效的 JP 节点"
            echo "changes_detected=false" >> $GITHUB_ENV
            exit 0
          fi

          # 7. 去重处理
          echo "🔄 去重处理..."
          sort -u valid_ipsyd.tmp -o valid_ipsyd.tmp
          
          # 重新编号
          echo "🔄 重新编号节点..."
          awk -F'#' '{print $1}' valid_ipsyd.tmp > ips_only.tmp
          rm -f valid_ipsyd_final.tmp
          counter=0
          while IFS= read -r ip_port; do
            if [ -n "$ip_port" ]; then
              counter=$((counter + 1))
              echo "${ip_port}#天诚${counter}" >> valid_ipsyd_final.tmp
            fi
          done < ips_only.tmp
          mv valid_ipsyd_final.tmp valid_ipsyd.tmp
          rm -f ips_only.tmp

          echo "✅ 共找到 $(wc -l < valid_ipsyd.tmp) 个唯一节点"

          # 8. 对比并更新文件
          OLD_FILE="valid_ipsyd.txt"
          SHOULD_COMMIT=false
          
          if [ -f "$OLD_FILE" ]; then
            if ! diff -q "$OLD_FILE" valid_ipsyd.tmp > /dev/null 2>&1; then
              echo "检测到内容更新，准备提交。"
              SHOULD_COMMIT=true
            else
              echo "内容未发生变化，跳过提交。"
            fi
          else
            echo "初次运行，准备创建新文件。"
            SHOULD_COMMIT=true
          fi

          if [ "$SHOULD_COMMIT" = true ]; then
            # 备份旧文件
            
            
            # 复制新文件
            cp valid_ipsyd.tmp valid_ipsyd.txt
            echo "✅ 已生成 valid_ipsyd.txt，共 $(wc -l < valid_ipsyd.txt) 个节点"
            
            BJ_TIME=$(TZ='Asia/Shanghai' date +'%m-%d %H:%M')
            echo "COMMIT_TIME=$BJ_TIME" >> $GITHUB_ENV
            echo "changes_detected=true" >> $GITHUB_ENV
          else
            echo "changes_detected=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push
        if: env.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "更新 ${{ env.COMMIT_TIME }}"
          file_pattern: 'valid_ipsyd.txt'
