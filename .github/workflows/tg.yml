on:
  schedule:
    - cron: '30 02 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  sign-job:
    name: sign-job-name
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: install tg-signer
      run: |
        pip3 install tg-signer
        # 验证安装
        tg-signer --version || echo "tg-signer installed"
    - name: sign
      env:
        SESSION_STRING: ${{ secrets.SESSION_STRINGS }}
        TASK_MAP: ${{ secrets.TASK_MAP }}
      run: |
        python3 << 'EOF'
        import os
        import json
        import subprocess
        import sys
        
        def run_command(cmd, env=None):
            """运行命令并返回输出"""
            try:
                result = subprocess.run(
                    cmd,
                    capture_output=True,
                    text=True,
                    env=env or os.environ.copy()
                )
                return result
            except Exception as e:
                print(f"Error running command: {e}")
                return None
        
        # 检查环境变量
        task_map_str = os.environ.get('TASK_MAP', '')
        if not task_map_str:
            print("Error: TASK_MAP is empty")
            sys.exit(1)
        
        session_string = os.environ.get('SESSION_STRING', '')
        if not session_string:
            print("Error: SESSION_STRING is empty")
            sys.exit(1)
        
        # 解析 JSON
        try:
            task_map = json.loads(task_map_str)
            print(f"Loaded tasks: {list(task_map.keys())}")
        except json.JSONDecodeError as e:
            print(f"Error: Invalid JSON in TASK_MAP: {e}")
            print(f"Content: {task_map_str}")
            sys.exit(1)
        
        # 处理每个任务
        for key, value in task_map.items():
            print(f"\n{'='*60}")
            print(f"Processing task: {key}")
            print(f"{'='*60}")
            
            # 创建配置目录
            task_path = f".signer/signs/{key}"
            os.makedirs(task_path, exist_ok=True)
            
            # 写入配置文件
            config_path = f"{task_path}/config.json"
            with open(config_path, 'w') as f:
                json.dump(value, f, indent=2, ensure_ascii=False)
            
            # 显示配置内容（调试用，隐藏敏感信息）
            print(f"Config saved to: {config_path}")
            config_preview = json.dumps(value, indent=2, ensure_ascii=False)
            # 如果 chat_id 是敏感信息，可以隐藏
            # config_preview = config_preview.replace(str(value.get('chats', [{}])[0].get('chat_id', '')), '***')
            print(f"Config content preview:\n{config_preview[:500]}...")
            
            # 先测试命令是否可用
            test_cmd = ["tg-signer", "--help"]
            test_result = run_command(test_cmd)
            if test_result and test_result.returncode == 0:
                print("tg-signer command is available")
            else:
                print("Error: tg-signer command not working")
                if test_result:
                    print(f"stderr: {test_result.stderr}")
                sys.exit(1)
            
            # 执行 tg-signer
            print(f"\nExecuting: tg-signer --session-string [HIDDEN] run-once {key}")
            cmd = [
                "tg-signer",
                "--session-string", session_string,
                "run-once",
                key
            ]
            
            # 创建环境变量副本，不暴露 session_string
            env = os.environ.copy()
            # 如果需要在子进程中隐藏敏感信息，可以移除 SESSION_STRING
            # 但 tg-signer 需要它，所以保留
            
            result = run_command(cmd, env)
            
            if result is None:
                print(f"Error: Failed to execute command for {key}")
                sys.exit(1)
            
            # 显示命令输出（但隐藏敏感信息）
            if result.stdout:
                # 过滤可能的敏感信息
                stdout_lines = result.stdout.split('\n')
                for line in stdout_lines:
                    if 'session' in line.lower() or 'string' in line.lower():
                        print("[HIDDEN]")
                    else:
                        print(line)
            
            if result.stderr:
                stderr_lines = result.stderr.split('\n')
                for line in stderr_lines:
                    if 'session' in line.lower() or 'string' in line.lower():
                        print(f"[HIDDEN] {line[:20]}...")
                    else:
                        print(f"Error: {line}")
            
            if result.returncode != 0:
                print(f"\n❌ Task '{key}' failed with exit code: {result.returncode}")
                # 不立即退出，继续处理其他任务？
                # sys.exit(1)
            else:
                print(f"\n✅ Task '{key}' completed successfully")
        
        print("\n" + "="*60)
        print("All tasks processed")
        EOF
    - name: 拉取代码
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
    - name: 自动续命Actions(防止60天禁用action)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "auto keep actions alive (no code change)"
        git push origin main
