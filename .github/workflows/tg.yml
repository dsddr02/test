on:
  schedule:
    - cron: '30 02 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  sign-job:
    name: sign-job-name
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: install tg-signer
      run: |
        pip3 install tg-signer
    - name: sign
      env:
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
        TASK_MAP: ${{ secrets.TASK_MAP }}
      run: |
        # 先验证 TASK_MAP 格式
        if [ -z "$TASK_MAP" ]; then
          echo "Error: TASK_MAP is empty"
          exit 1
        fi
        
        # 验证 JSON 格式
        if ! echo "$TASK_MAP" | jq empty 2>/dev/null; then
          echo "Error: Invalid JSON format in TASK_MAP"
          echo "$TASK_MAP" | jq . 2>&1 || true
          exit 1
        fi
        
        # 使用更稳健的方式处理 JSON
        echo "$TASK_MAP" | jq -r 'to_entries[] | @base64' | while read -r entry_b64; do
          # 解码 base64
          entry=$(echo "$entry_b64" | base64 -d)
          key=$(echo "$entry" | jq -r '.key')
          value=$(echo "$entry" | jq -c '.value')
          
          task_path=".signer/signs/${key}"
          mkdir -p "${task_path}"
          config_name="${task_path}/config.json"
          echo "$value" | jq . > "$config_name"
          
          echo "Processing task: ${key}"
          # 显示配置内容（调试用）
          cat "$config_name"
          
          # 执行任务
          tg-signer --session-string "$SESSION_STRING" run-once "${key}" > /dev/null 2>&1
        done
    - name: 拉取代码
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
    - name: 自动续命Actions(防止60天禁用action)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "auto keep actions alive (no code change)"
        git push origin main
