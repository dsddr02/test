on:
  schedule:
    - cron: '30 02 * * *'   # UTC 02:30 (北京时间 10:30)
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sign-job:
    name: sign-job-name
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Set up Python
      # 注意：官方最新稳定版是 v5，v6 会报 Action 找不到的错误
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tg-signer
      run: |
        pip3 install tg-signer

    - name: Sign
      env:
        SESSION_STRING: ${{ secrets.SESSION_STRINGS }}
        TASK_MAP: ${{ secrets.TASK_MAP }}
      shell: bash   # 显式指定 bash，双保险
      run: |
        # 使用 jq 提取任务名，用 for 循环遍历，避免复杂的管道和 Bash 专有语法
        for key in $(echo "$TASK_MAP" | jq -r 'keys[]'); do
          task_path=".signer/signs/${key}"
          mkdir -p "$task_path"
          
          # 安全提取该任务的配置并写入 config.json（使用 jq --arg 避免引号嵌套错误）
          echo "$TASK_MAP" | jq -c --arg k "$key" '.[$k]' > "${task_path}/config.json"
          
          # 执行签到（静默模式，保护隐私）
          tg-signer --session-string "$SESSION_STRING" run-once "$key" > 
        done

    - name: 拉取代码
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: 自动续命 Actions (防止60天禁用)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "auto keep actions alive (no code change)"
        git push origin main
