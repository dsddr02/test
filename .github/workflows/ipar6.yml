# .github/workflows/screenshot.yml
name: Daily Screenshot
on:
  schedule:
    - cron: '24 6 * * *'  # 每天8点运行
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install cloakbrowser fake-useragent
      - run: python your_script.py
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
