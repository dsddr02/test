name: tiancheng1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install cloudscraper

      - name: Process and Compare
        run: |
          # 1. 使用 Python 脚本绕过 CF 5秒盾并抓取
          echo "正在通过 Python cloudscraper 抓取数据..."
          cat << 'EOF' > scraper.py
          import cloudscraper
          import sys
          import re

          def fetch_data():
              scraper = cloudscraper.create_scraper(
                  browser={
                      'browser': 'chrome',
                      'platform': 'windows',
                      'desktop': True
                  }
              )
              url = "https://vl.cm.soso.edu.kg/sub?uuid=00000000-0000-4000-8000-000000000000&host=example.com"
              try:
                  res = scraper.get(url, timeout=10)
                  if res.status_code == 200:
                      html = res.text
                      if "<pre" in html:
                          match = re.search(r'<pre[^>]*>(.*?)</pre>', html, re.S)
                          if match:
                              return match.group(1).strip()
                      return html.strip()
                  else:
                      print(f"Error: Status code {res.status_code}", file=sys.stderr)
                      return None
              except Exception as e:
                  print(f"Exception: {str(e)}", file=sys.stderr)
                  return None

          data = fetch_data()
          if data:
              print(data)
          else:
              sys.exit(1)
          EOF

          MAX_RETRIES=3
          RETRY_COUNT=0
          response=""

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            response=$(python3 scraper.py)
            if [ $? -eq 0 ] && [ -n "$response" ]; then
              echo "✅ 数据抓取成功！"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⚠️ 抓取失败，第 $RETRY_COUNT 次重试..."
              sleep 5
            fi
          done

          if [ -z "$response" ]; then
            echo "❌ 无法绕过防护，跳过执行。"
            echo "changes_detected=false" >> $GITHUB_ENV
            exit 0
          fi

          # 2. 解码并校验内容
          decoded_data=$(echo "$response" | base64 -d 2>/dev/null)
          if [[ ! "$decoded_data" =~ "vless://" ]]; then
            echo "错误：解码数据格式非法。"
            echo "changes_detected=false" >> $GITHUB_ENV
            exit 0
          fi

          # 3. 解析节点，只筛选 JP 区域，并依次编号
          echo "数据校验通过，开始解析节点..."
          rm -f valid_ipsyd.tmp
          
          # 初始化计数器
          counter=0
          
          echo "$decoded_data" | while IFS= read -r line; do
            if [[ -z "$line" ]]; then continue; fi
            ip_port=$(echo "$line" | grep -oP '(?<=@).*?(?=\?)')
            raw_tag=$(echo "$line" | awk -F'#' '{print $2}')
            tag=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(urllib.parse.unquote(sys.argv[1])))" "$raw_tag" | tr -d '\r')
            remark="$tag"
            
            # 如果 tag 中包含某些字符，跳过
            if echo "$remark" | grep -q -E "官方优选|security|path"; then 
              echo "剔除节点: $tag"
              continue
            fi        
            
            # 判断是否为 JP 区域（日本）
            if [[ "$remark" =~ "日本" || "$remark" =~ "JP" || "$remark" =~ "🇯🇵" ]]; then 
                # 只保留 JP 区域的节点，格式为 ip:port#天诚N
                if [[ -n "$ip_port" ]]; then
                  # 计数器递增（使用文件来保持跨进程的计数）
                  counter=$((counter + 1))
                  echo "${ip_port}#天诚${counter}" >> valid_ipsyd.tmp
                  echo "✅ 添加 JP 节点: ${ip_port}#天诚${counter}"
                fi
            fi
          done

          # 4. 对比并更新文件
          OLD_FILE="valid_ipsyd.txt"
          SHOULD_COMMIT=false
          
          if [ -f "$OLD_FILE" ]; then
            if ! diff -q "$OLD_FILE" valid_ipsyd.tmp > /dev/null 2>&1; then
              echo "检测到内容更新，准备提交。"
              SHOULD_COMMIT=true
            else
              echo "内容未发生变化，跳过提交。"
            fi
          else
            echo "初次运行，准备创建新文件。"
            SHOULD_COMMIT=true
          fi

          if [ "$SHOULD_COMMIT" = true ]; then
            # 备份旧文件
            if [ -f "$OLD_FILE" ]; then
              mkdir -p old
              cp "$OLD_FILE" "old/$(TZ='Asia/Shanghai' date +%Y-%m-%d-%H_%M_%S)_valid_ipsyd.txt"
            fi
            
            # 复制新文件到根目录
            if [ -f valid_ipsyd.tmp ]; then
              cp valid_ipsyd.tmp valid_ipsyd.txt
              echo "✅ 已生成 valid_ipsyd.txt，共 $(wc -l < valid_ipsyd.txt) 个节点"
            else
              echo "⚠️ 未找到任何"
              echo "changes_detected=false" >> $GITHUB_ENV
              exit 0
            fi
            
            BJ_TIME=$(TZ='Asia/Shanghai' date +'%m-%d %H:%M')
            echo "COMMIT_TIME=$BJ_TIME" >> $GITHUB_ENV
            echo "changes_detected=true" >> $GITHUB_ENV
          else
            echo "changes_detected=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push
        if: env.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "更新 ${{ env.COMMIT_TIME }}"
          file_pattern: 'valid_ipsyd.txt old/*.txt'
